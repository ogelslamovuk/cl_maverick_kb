site_name: База знаний Maverick
site_description: Рабочие инструкции и справка по задачам экосистемы Maverick
site_url: https://faq.cinemalab.io/

copyright: © CinemaLab · Maverick Knowledge Base

extra:
  generator: false
  article_author: Кирилл Осинский
  article_updated: 1 июля 2026

theme:
  name: material
  custom_dir: overrides
  language: ru
  logo: assets/brand/maverick_logo.png
  favicon: assets/brand/cinemalab_logo.jpg
  palette:
    - scheme: default
      primary: white
      accent: blue
  features:
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.path
    - navigation.prune
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy

plugins:
  - kb-short-urls
  - search:
      lang:
        - ru
        - en
      separator: '[\s\-\.]+'

exclude_docs: |
  /Gaps.md
  /MAVERICK_KB_*.md
  /Seller/Базовая работа в Seller Web.md
  /WIKI_DIGESTION_RULES.md

markdown_extensions:
  - toc
  - tables
  - fenced_code
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/search-fallback.js
  - javascripts/kb-enhancements.js

